<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline · upExpense</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #171717;
      text-align: center;
      padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #ededed; }
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      margin: 0 auto 20px;
      display: block;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; opacity: 0.7; font-size: 0.9rem; }
    button {
      background: #059669;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/icon-192.png" alt="upExpense" />
    <h1>You're offline</h1>
    <p>upExpense needs a connection to load your expenses.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
